# GitHub-Pages preview of the site.
#
#   docker compose up -d --build                  -> http://localhost:4000
#   PREVIEW_PORT=3000 docker compose up -d        -> on the platform preview port
#
# The repo is bind-mounted, so edits rebuild in place (polling watch).
services:
  preview:
    build:
      context: .
      args:
        GITHUB_PAGES_VERSION: "232"
    image: newspaces-preview:pages
    init: true
    ports:
      - "${PREVIEW_PORT:-4000}:4000"
    volumes:
      - .:/srv/site
